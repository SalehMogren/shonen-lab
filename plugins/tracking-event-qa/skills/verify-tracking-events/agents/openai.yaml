interface:
  display_name: "Verify Tracking Events"
  short_description: "Prove QA events on every channel the plan requires."
  brand_color: "#7C3AED"
  default_prompt: "Use $verify-tracking-events to verify all tracking events currently marked QA."
dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Read and update the configured tracking-plan database."
    - type: "mcp"
      value: "posthog"
      description: "Inspect event taxonomy and query observed event traffic."
    - type: "mcp"
      value: "event-stream"
      description: "Optional. Query the second tracking channel when the profile configures one."
policy:
  allow_implicit_invocation: true
